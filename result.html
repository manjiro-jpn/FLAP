<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>結果表示</title>
<style>
body{font-family:sans-serif;margin:16px;background:#f5f5f5;}
h1{font-size:1.3em;}
table{border-collapse:collapse;width:100%;margin:12px 0;background:#fff;}
th,td{border:1px solid #ccc;padding:6px 8px;text-align:center;font-size:0.9em;}
th{background:#e0e0e0;}
.bar-container{width:100%;background:#eee;border-radius:4px;height:18px;}
.bar{height:18px;background:#4CAF50;border-radius:4px;text-align:center;color:#fff;font-size:0.75em;line-height:18px;}
.change-block{background:#fff;padding:10px;border-radius:8px;margin:8px 0;}
.change-title{font-weight:bold;margin-bottom:4px;}
.in{color:green;font-weight:bold;}
.out{color:red;font-weight:bold;}
button{padding:8px 16px;font-size:1em;border:none;border-radius:4px;cursor:pointer;margin:4px;}
.btn-nav{background:#2196F3;color:#fff;}
</style>
</head>
<body>
<h1>⚽ 結果・出場時間</h1>
<div id="result"></div>
<br>
<button class="btn-nav" onclick="location.href='phase.html'">← フェーズ入力</button>
<button class="btn-nav" onclick="location.href='index.html'">← 選手登録</button>

<script>
var PHASE_NAMES=['前半 0-15','前半 15-30','後半 0-15','後半 15-30'];
var FORMATIONS={'14231':'1-4-2-3-1','1442':'1-4-4-2','1352':'1-3-5-2','1343':'1-3-4-3'};

function render(){
  var md=JSON.parse(localStorage.getItem('matchData')||'{}');
  var container=document.getElementById('result');
  if(!md.phase0){container.innerHTML='<p>データがありません。フェーズ入力で保存してください。</p>';return;}

  var allPlayers={};
  for(var p=0;p<4;p++){
    var ph=md['phase'+p];
    if(!ph) continue;
    for(var i=0;i<ph.members.length;i++){
      var name=ph.members[i];
      if(!name) continue;
      if(!allPlayers[name]) allPlayers[name]=[0,0,0,0];
      allPlayers[name][p]=1;
    }
  }

  var html='<table><tr><th>選手</th>';
  for(var p=0;p<4;p++) html+='<th>'+PHASE_NAMES[p]+'</th>';
  html+='<th>合計</th><th>出場時間バー</th></tr>';

  var names=Object.keys(allPlayers);
  for(var n=0;n<names.length;n++){
    var name=names[n];
    var phases=allPlayers[name];
    var total=0;
    html+='<tr><td>'+name+'</td>';
    for(var p=0;p<4;p++){
      html+='<td>'+(phases[p]?'○':'−')+'</td>';
      total+=phases[p]*15;
    }
    var pct=Math.round(total/60*100);
    html+='<td>'+total+'分</td>';
    html+='<td><div class="bar-container"><div class="bar" style="width:'+pct+'%">'+total+'分</div></div></td>';
    html+='</tr>';
  }
  html+='</table>';

  for(var p=1;p<4;p++){
    var prev=md['phase'+(p-1)];
    var curr=md['phase'+p];
    if(!prev||!curr) continue;
    var prevSet={};var currSet={};
    for(var i=0;i<prev.members.length;i++) if(prev.members[i]) prevSet[prev.members[i]]=1;
    for(var i=0;i<curr.members.length;i++) if(curr.members[i]) currSet[curr.members[i]]=1;
    var inList=[];var outList=[];
    for(var k in currSet) if(!prevSet[k]) inList.push(k);
    for(var k in prevSet) if(!currSet[k]) outList.push(k);
    html+='<div class="change-block"><div class="change-title">'+PHASE_NAMES[p-1]+' → '+PHASE_NAMES[p]+'</div>';
    if(prev.system!==curr.system) html+='<div>システム変更: '+FORMATIONS[prev.system]+' → '+FORMATIONS[curr.system]+'</div>';
    if(inList.length||outList.length){
      if(inList.length) html+='<div class="in">IN: '+inList.join(', ')+'</div>';
      if(outList.length) html+='<div class="out">OUT: '+outList.join(', ')+'</div>';
    } else {
      html+='<div>交代なし</div>';
    }
    html+='</div>';
  }
  container.innerHTML=html;
}
render();
</script>
</body>
</html>
