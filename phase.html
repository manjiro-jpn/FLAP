<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フェーズ入力</title>
<style>
body{font-family:sans-serif;margin:16px;background:#f5f5f5;}
h1{font-size:1.3em;}
.phase-block{background:#fff;padding:12px;border-radius:8px;margin-bottom:16px;}
.phase-title{font-weight:bold;font-size:1.1em;margin-bottom:8px;}
select{padding:6px;font-size:0.95em;border:1px solid #ccc;border-radius:4px;margin:2px;}
.row{display:flex;justify-content:center;gap:6px;margin:6px 0;flex-wrap:wrap;}
.row select{flex:1;min-width:80px;max-width:140px;}
button{padding:8px 16px;font-size:1em;border:none;border-radius:4px;cursor:pointer;margin:4px;}
.btn-copy{background:#FF9800;color:#fff;font-size:0.85em;padding:6px 12px;}
.btn-save{background:#4CAF50;color:#fff;}
.btn-nav{background:#2196F3;color:#fff;}
.sys-select{margin-bottom:8px;}
.msg{color:red;font-size:0.85em;margin-top:4px;}
.dup-warn{color:red;font-weight:bold;font-size:0.85em;}
</style>
</head>
<body>
<h1>⚽ フェーズ入力</h1>
<div id="phases"></div>
<div id="globalMsg" class="msg"></div>
<br>
<button class="btn-save" onclick="saveAll()">💾 保存</button>
<button class="btn-nav" onclick="location.href='index.html'">← 選手登録</button>
<button class="btn-nav" onclick="location.href='result.html'">結果へ →</button>

<script>
var FORMATIONS = {
  '14231':{label:'1-4-2-3-1',rows:[1,4,2,3,1]},
  '1442':{label:'1-4-4-2',rows:[1,4,4,2]},
  '1352':{label:'1-3-5-2',rows:[1,3,5,2]},
  '1343':{label:'1-3-4-3',rows:[1,3,4,3]}
};
var PHASE_NAMES = ['前半 0-15','前半 15-30','後半 0-15','後半 15-30'];

function getPlayers(){return JSON.parse(localStorage.getItem('players')||'[]');}
function getMatchData(){return JSON.parse(localStorage.getItem('matchData')||'{}');}
function saveMatchData(d){localStorage.setItem('matchData',JSON.stringify(d));}

function buildPhases(){
  var container=document.getElementById('phases');
  container.innerHTML='';
  var md=getMatchData();
  for(var p=0;p<4;p++){
    var saved=md['phase'+p]||{};
    var div=document.createElement('div');
    div.className='phase-block';
    div.id='phaseBlock'+p;
    var sysVal=saved.system||'14231';
    var html='<div class="phase-title">'+PHASE_NAMES[p]+'</div>';
    html+='<div class="sys-select">システム：<select id="sys'+p+'" onchange="onSystemChange('+p+')">';
    for(var k in FORMATIONS){
      html+='<option value="'+k+'"'+(k===sysVal?' selected':'')+'>'+FORMATIONS[k].label+'</option>';
    }
    html+='</select></div>';
    if(p>0) html+='<button class="btn-copy" onclick="copyPrev('+p+')">↑前フェーズコピー</button>';
    html+='<div id="grid'+p+'"></div>';
    html+='<div id="dup'+p+'" class="dup-warn"></div>';
    div.innerHTML=html;
    container.appendChild(div);
    buildGrid(p,sysVal,saved.members||[]);
  }
}

function buildGrid(p,sysKey,members){
  var rows=FORMATIONS[sysKey].rows;
  var grid=document.getElementById('grid'+p);
  grid.innerHTML='';
  var players=getPlayers();
  var idx=0;
  for(var r=0;r<rows.length;r++){
    var rowDiv=document.createElement('div');
    rowDiv.className='row';
    for(var c=0;c<rows[r];c++){
      var sel=document.createElement('select');
      sel.id='sel_'+p+'_'+idx;
      sel.setAttribute('data-phase',p);
      sel.onchange=function(){checkDup(this.getAttribute('data-phase'));};
      var opt=document.createElement('option');
      opt.value='';opt.textContent='--';
      sel.appendChild(opt);
      for(var i=0;i<players.length;i++){
        var o=document.createElement('option');
        o.value=players[i];o.textContent=players[i];
        if(members[idx]===players[i]) o.selected=true;
        sel.appendChild(o);
      }
      rowDiv.appendChild(sel);
      idx++;
    }
    grid.appendChild(rowDiv);
  }
}

function getSelections(p){
  var arr=[];
  for(var i=0;i<11;i++){
    var s=document.getElementById('sel_'+p+'_'+i);
    if(s) arr.push(s.value); else arr.push('');
  }
  return arr;
}

function checkDup(p){
  p=parseInt(p);
  var arr=getSelections(p);
  var seen={};var dups=[];
  for(var i=0;i<arr.length;i++){
    if(arr[i]==='') continue;
    if(seen[arr[i]]) dups.push(arr[i]); else seen[arr[i]]=true;
  }
  var el=document.getElementById('dup'+p);
  if(dups.length>0){
    el.textContent='⚠ 重複: '+dups.join(', ');
  } else {
    el.textContent='';
  }
  return dups.length===0;
}

function onSystemChange(p){
  var sysKey=document.getElementById('sys'+p).value;
  var oldMembers=getSelections(p);
  var newRows=FORMATIONS[sysKey].rows;
  var newTotal=0;
  for(var i=0;i<newRows.length;i++) newTotal+=newRows[i];
  var adjusted=[];
  for(var i=0;i<newTotal;i++){
    adjusted.push(i<oldMembers.length?oldMembers[i]:'');
  }
  buildGrid(p,sysKey,adjusted);
}

function copyPrev(p){
  var prevSys=document.getElementById('sys'+(p-1)).value;
  var prevMembers=getSelections(p-1);
  document.getElementById('sys'+p).value=prevSys;
  buildGrid(p,prevSys,prevMembers);
  checkDup(p);
}

function saveAll(){
  var md={};
  for(var p=0;p<4;p++){
    if(!checkDup(p)){
      document.getElementById('globalMsg').textContent='フェーズ'+(p+1)+'に重複があります。修正してください。';
      return;
    }
    md['phase'+p]={
      system:document.getElementById('sys'+p).value,
      members:getSelections(p)
    };
  }
  saveMatchData(md);
  document.getElementById('globalMsg').textContent='';
  alert('保存しました！');
}

buildPhases();
</script>
</body>
</html>
